name: Eco 1 Auto-Fix & Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Auto-Fix, Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci || npm install

      - name: Expo dependency health check
        run: npx expo install --check || true

      - name: Auto-fix lint issues
        run: npm exec --yes eslint -- App.js --fix || true

      - name: Verify JavaScript syntax
        run: node --check App.js

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Eco1.apk

      - name: Upload Eco 1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Eco1-Android-APK
          path: dist/Eco1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit safe automatic repairs
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json App.js app.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto-fix): repair Eco 1 build configuration"
            git push
          else
            echo "No automatic repairs required"
          fi
